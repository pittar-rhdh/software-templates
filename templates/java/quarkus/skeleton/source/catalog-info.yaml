apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{values.componentId}}
  {%- if values.description %}
  description: ${{values.description}}
  {%- endif %}
  annotations:
    backstage.io/source-location: url:https://github.com/pittar-rhdh/${{ values.repo }}/
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-id: ${{values.componentId}}
    janus-idp.io/tekton: ${{values.componentId}}
    argocd/app-selector: rht-gitops.com/openshift-gitops=${{values.componentId}}
    acs/deployment-name: "${{values.componentId}},postgresql-${{values.componentId}}"
  tags:
    - java
    - quarkus
  links:
    - url: https://devspaces.apps.prime.pitt.ca/#https://github.com/pittar-rhdh/${{ values.repo }}
      title: Open in Dev Spaces
      icon: web
    - url: https://developers.redhat.com/blog
      title: Red Hat Blog
      icon: web
spec:
  type: service
  lifecycle: production
  owner: ${{values.owner}}
