openapi: 3.0.3
info:
  title: Fruit Management API
  description: API for performing CRUD operations on fruits.
  version: 1.0.0

paths:
  /fruits:
    get:
      summary: List all fruits
      operationId: getFruits
      tags:
        - Fruits
      responses:
        '200':
          description: A list of fruits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fruit'

    post:
      summary: Create a new fruit
      operationId: createFruit
      tags:
        - Fruits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FruitInput'
      responses:
        '201':
          description: Fruit created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fruit'

  /fruits/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The numeric ID of the fruit
        schema:
          type: integer
          format: int64

    get:
      summary: Get a fruit by ID
      operationId: getFruitById
      tags:
        - Fruits
      responses:
        '200':
          description: Fruit found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fruit'
        '404':
          description: Fruit not found

    put:
      summary: Update an existing fruit
      operationId: updateFruit
      tags:
        - Fruits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FruitInput'
      responses:
        '200':
          description: Fruit updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fruit'
        '404':
          description: Fruit not found

    delete:
      summary: Delete a fruit
      operationId: deleteFruit
      tags:
        - Fruits
      responses:
        '204':
          description: Fruit deleted successfully
        '404':
          description: Fruit not found

components:
  schemas:
    Fruit:
      type: object
      required:
        - id
        - name
        - colour
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Apple
        colour:
          type: string
          example: Red

    FruitInput:
      type: object
      required:
        - name
        - colour
      properties:
        name:
          type: string
          example: Apple
        colour:
          type: string
          example: Red