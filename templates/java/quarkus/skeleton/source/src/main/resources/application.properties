# Quarkus Application Configuration

# HTTP Configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Database Configuration (PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:appuser}
quarkus.datasource.password=${DB_PASSWORD:apppass}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appdb}

# Hibernate Configuration
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.sql-load-script=no-file

# Development Profile Settings
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=import.sql

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.console.enabled=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%n

# Health Check Configuration
quarkus.smallrye-health.enabled=true

# Metrics Configuration
quarkus.smallrye-metrics.enabled=true