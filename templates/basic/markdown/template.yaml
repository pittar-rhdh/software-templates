apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: basic-markdown
  title: "Basic Markdown Repository"
  description: Template to create a basic Markdown repository.
  tags:
    - Markdown
    - AI
spec:
  owner: default/teamlead
  type: service
  parameters:
    - title: Repository Information
      required:
        - repoName
      properties:
        repoName:
          type: string
          title: Repository Name
    - title: Component Information
      required:
        - componentId
        - name
        - owner
        - description
      properties:
        componentId:
          title: Project ID
          type: string
          description: Unique name of the Project. Lower case with no special characters.
          default: defaultproject
          pattern: '^([a-z]*)*$'
        name:
          title: Name
          type: string
          description: Unique name of the component. Expecting a string that is sequences of [a-zA-Z0-9] separated by any of [-_.], at most 63 characters in total.
          ui:autofocus: true
          ui:options:
            rows: 5
        owner:
          title: Owner
          type: string
          description: Owner of the component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        description:
          title: Description
          type: string
          description: Project description. Used in documentation.
  steps:
    - id: fetch
      name: Fetch Template
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: .
        values:
          componentId: ${{ parameters.componentId }}
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          description: ${{ parameters.description }}
          repo: ${{ parameters.repoName }}
    - id: publish-repository
      name: Publish Repository
      action: publish:github
      input:
        repoUrl: 'github.com?repo=${{ parameters.repoName }}&owner=pittar-rhdh'
        repoVisibility: public
        description: Repository created by Backstage template
        topics: ['backstage', 'template', 'markdown']
    - action: catalog:register
      id: register
      name: Register
      input:
        repoContentsUrl: ${{ steps.publishSource.output.repoContentsUrl }}
        catalogInfoPath: catalog-info.yaml
  output:
    links:
      - title: Repository
        url: 'https://github.com/pittar-rhdh/${{ parameters.repoName }}'
