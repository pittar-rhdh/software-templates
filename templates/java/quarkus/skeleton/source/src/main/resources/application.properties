# ===================================================================
# Application Configuration
# ===================================================================
quarkus.application.name=${{values.componentId}}

# ===================================================================
# HTTP Server Configuration
# ===================================================================
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# ===================================================================
# Logging Configuration
# ===================================================================
quarkus.log.level=INFO
quarkus.log.console.enabled=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId}, parentId=%X{parentId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{2.}] (%t) %s%e%n

# ===================================================================
# OpenAPI Configuration
# ===================================================================
quarkus.openapi.generator.server.use=openapitools
quarkus.openapi.generator.server.input-base-dir=src/main/openapi
quarkus.openapi.generator.server.spec.openapi_yaml.base-package=${{values.groupId}}.${{values.aftifactId}}.api

# ===================================================================
# Observability Configuration
# ===================================================================
quarkus.otel.exporter.otlp.endpoint=http://otel-sno-collector.tempo-observability.svc.cluster.local:4317
quarkus.datasource.jdbc.telemetry=true

# ===================================================================
# Database Configuration
# ===================================================================

# Base Database Configuration
quarkus.datasource.db-kind=postgresql

# Dev Services Configuration
# Automatically provides PostgreSQL container in dev mode
# Default credentials: username=quarkus, password=quarkus, database=quarkus
# To disable: quarkus.datasource.devservices.enabled=false
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.port=5432
quarkus.datasource.devservices.db-name=quarkus

# Alternative H2 Configuration (when Docker is unavailable)
# %dev.quarkus.datasource.db-kind=h2
# %dev.quarkus.datasource.devservices.enabled=false
# %dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1

# Data Persistence (Optional - preserves DB data across restarts)
# quarkus.datasource.devservices.volumes."/tmp/quarkus-dev-services"=/var/lib/postgresql/data

# ===================================================================
# Hibernate Configuration
# ===================================================================
quarkus.hibernate-orm.schema-management.strategy=update

# ===================================================================
# Profile-Specific Configurations
# ===================================================================

# Development Profile
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
#%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.dev-ui.cors.enabled=false
%dev.quarkus.dev-ui.hosts=.*

# Test Profile
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
#%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Production Profile
%prod.quarkus.datasource.username=${DB_USERNAME:appuser}
%prod.quarkus.datasource.password=${DB_PASSWORD:apppass}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appdb}

# ===================================================================
# Optional Configurations (Commented)
# ===================================================================

# Database Initialization Script
# Only load sample data in dev and test modes, not production
%dev.quarkus.hibernate-orm.sql-load-script=import.sql
%test.quarkus.hibernate-orm.sql-load-script=import.sql

# Health Checks
# quarkus.smallrye-health.enabled=true

# Metrics
# quarkus.smallrye-metrics.enabled=true