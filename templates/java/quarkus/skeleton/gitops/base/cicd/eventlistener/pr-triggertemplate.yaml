apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: ai-pr-review-template
spec:
  # Parameters passed from the TriggerBinding
  params:
    - name: pr-number
      description: The Pull Request ID
    - name: git-repo-fullname
      description: The repository owner/name (e.g. pittar-sandbox/image-inspector)

  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: ai-pr-review-run-
        labels:
          tekton.dev/pipeline: ai-pr-review
          triggers.tekton.dev/event: "pull-request"
      spec:
        pipelineRef:
          name: ai-pr-review
        
        # Mapping Template params to Pipeline params
        params:
          - name: PR_NUMBER
            value: $(tt.params.pr-number)
          - name: GIT_REPO
            value: $(tt.params.git-repo-fullname)

        # Mapping the Pipeline workspace to the existing PVC
        workspaces:
          - name: workspace
            persistentVolumeClaim:
              claimName: workspace