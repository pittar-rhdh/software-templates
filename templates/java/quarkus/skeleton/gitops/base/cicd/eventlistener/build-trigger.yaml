apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: build-trigger
spec:
  # The ServiceAccount that grants permissions to create the PipelineRun
  serviceAccountName: pipeline

  # Interceptors filter the payload before it triggers the pipeline
  interceptors:
    # 1. GitHub Interceptor: Validates the payload structure and secret
    - ref:
        name: "github"
      params:
        - name: "eventTypes"
          value: ["push"]
        # Uncomment and configure if you are using a webhook secret (Highly Recommended)
        - name: "secretRef"
          value:
            secretName: github-secret
            secretKey: secretToken

  # Map the payload to parameters
  bindings:
    - ref: github-build-binding

  # Define what resource to create
  template:
    ref: build-template